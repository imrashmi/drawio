<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="page-title"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/imrashmi/dev-assests@cdn/Assets/Logo/logo_transparent_512.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 2vw;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url('https://cdn.jsdelivr.net/gh/imrashmi/dev-assests@cdn/Assets/Img/jpg/150674403813646273834b3fb.jpg') no-repeat center center/cover;
            filter: blur(6px);
            transform: scale(1.05);
            z-index: -1;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.6);
            padding: clamp(20px, 4vw, 50px);
            border-radius: 1.2rem;
            text-align: center;
            max-width: min(90vw, 700px);
            width: 100%;
            backdrop-filter: blur(5px);
        }

        .logo {
            width: clamp(120px, 20vw, 260px);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            margin-bottom: 0.5rem;
        }

        h2 {
            font-weight: 300;
            margin-bottom: 1.2rem;
            color: #ddd;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
        }

        p {
            font-size: clamp(0.9rem, 1.5vw, 1.05rem);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 0.6rem 1.5rem;
            border: 2px solid #fff;
            border-radius: 2rem;
            transition: 0.3s;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        footer {
            position: absolute;
            bottom: 1rem;
            font-size: 0.8rem;
            color: #ccc;
            text-align: center;
            width: 100%;
        }

        a.inline-link {
            color: #4fc3f7;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <img src="https://cdn.jsdelivr.net/gh/imrashmi/dev-assests@cdn/Assets/Logo/logo_transparent_512.png" class="logo">
        
        <h1 id="name"></h1>
        <h2 id="subtitle"></h2>
        <p id="about"></p>

        <div class="btn-container">
            <a href="https://imrashmi.github.io/drawio/README.md" class="btn">Docs</a>
            <a href="https://imrashmi.github.io/drawio/src/main/webapp/" class="btn" target="_blank">Visit Draw.io</a>
        </div>
    </div>

    <footer id="footer"></footer>

    <script>
        const data = {
            name: "RASHMI R. SWAIN",
            location: "Odisha, India",
            profession: "Research Scholar, Electrical Engg.",
            about: `This is the last supported version of Draw.io with Visio (VSDX) support.

As there's no where else I could find hosting this easily online, I have forked Draw.io at this version.

This means you can browse to <a href="https://mattie47.github.io/drawio/src/main/webapp/" target="_blank" class="inline-link">Draw.io WebApp</a> and then export your drawio diagram to Visio again 🙌

Note: This is purely a fork of draw.io. I won't make any changes, updates, or provide any support.`
        };

        document.getElementById("page-title").innerText = `${data.name} | Home`;
        document.getElementById("name").innerText = data.name;
        document.getElementById("subtitle").innerText = `${data.profession} | ${data.location}`;
        
        // ✅ FIXED: render HTML
        document.getElementById("about").innerHTML = data.about;

        document.getElementById("footer").innerText = `© ${new Date().getFullYear()} ${data.name}`;
    </script>

</body>
</html>
